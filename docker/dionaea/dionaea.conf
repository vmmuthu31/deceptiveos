# Dionaea Honeypot Configuration
# https://github.com/DinoSec/dionaea

logging = {
    default = {
        mode = "system"
        level = "info"
    }
}

server = {
    root = "/var/dionaea"
    run_as = "nobody"
    pid_path = "/var/dionaea/run/dionaea.pid"
    modules_path = "/usr/lib/dionaea/modules"
    data_path = "/var/dionaea/www"
    var_path = "/var/dionaea/var"
    lib_path = "/usr/lib/dionaea"
    sbindir = "/usr/sbin"
}

node = {
    name = "default"
    discovery = [
        "192.168.1.0/24"
    ]
}

modules = {
    python = {
        imports = ["evtr"]
    }
    emu = {
        services = ["http", "ssh", "ftp", "smb", "tftp"]
        listen_addr = "0.0.0.0"
    }
}

services = {
    http = {
        name = "http"
        config = {
            listen_port = 80
            listen_addr = "0.0.0.0"
        }
    }
    ssh = {
        name = "ssh"
        config = {
            listen_port = 22
            listen_addr = "0.0.0.0"
        }
    }
    ftp = {
        name = "ftp"
        config = {
            listen_port = 21
            listen_addr = "0.0.0.0"
        }
    }
}
