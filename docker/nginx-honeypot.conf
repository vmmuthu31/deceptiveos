# Fake internal corporate portal — logs all access attempts
server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/honeypot-access.log;

    location / {
        return 200 '<!DOCTYPE html><html><head><title>Acme Corp Internal Portal</title></head>
<body style="font-family:sans-serif;max-width:400px;margin:100px auto;text-align:center">
<h2>🔒 Acme Corp Internal Portal</h2>
<p>Authentication required. Please contact IT support.</p>
<form><input type="text" placeholder="Username" style="display:block;width:100%;margin:8px 0;padding:8px"><input type="password" placeholder="Password" style="display:block;width:100%;margin:8px 0;padding:8px"><button type="submit" style="padding:8px 24px">Login</button></form>
</body></html>';
        add_header Content-Type text/html;
    }
}
