[workspace]
resolver = "2"
members = [
    "crates/ciphernest-core",
    "crates/honeypot-engine",
    "crates/ai-engine",
    "crates/integration-layer",
    "crates/compliance",
    "crates/native",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ciphernest/ciphernest"

[workspace.dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono", "uuid"] }
redis = { version = "0.27", features = ["tokio-comp"] }

# ML/AI
linfa = "0.5"
burn = { version = "0.16", features = ["wgpu"] }

# Integration
stix2 = "0.3"
reqwest = { version = "0.22", features = ["json", "stream"] }

# Utilities
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }

# Native module
napi = { version = "3", features = ["napi9"] }
napi-derive = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3
